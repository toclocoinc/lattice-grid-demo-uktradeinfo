<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UK goods trade, month by month, from HMRC</title>
    <meta
      name="description"
      content="What the United Kingdom imports and exports, by commodity chapter and trading partner, over the last two years, from HM Revenue &amp; Customs' overseas trade statistics. Built with Lattice Grid loaded by script tag, with no install and no build."
    />
    <link rel="icon" href="data:," />
    <!--
      The grid's stylesheet, from jsDelivr. Every address on this page names
      the exact release, 1.62.0, and carries the hash of the file it expects,
      so the page can never quietly pick up a different build than the one it
      was checked against.
    -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@toclocoinc/lattice-grid@1.62.0/lattice-grid.min.css"
      integrity="sha384-cQ6NyLhccOT9SMHloVjf3kU8vDkT4XUQQs2bn8Ws170CsFdEjm9a66pkUaLc6No0"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="app">
      <div class="loading">
        <h1>UK goods trade, month by month</h1>
        <p class="loading-message">Starting...</p>
      </div>
    </main>

    <!--
      The library, as classic script tags. No npm install, no bundler, no
      `type="module"`: each file runs as it arrives and leaves a global behind.

        lattice-grid.min.js          LatticeGrid            the grid itself
        modules/charts.min.js        LatticeGrid.createChart  (extends the core, so it must follow it)
        modules/data-router.min.js   LatticeGridDataRouter
        modules/kpi.min.js           LatticeGridKPI
        modules/tabs.min.js          LatticeGridTabs

      The order matters once: the charts module folds itself into the core
      global rather than defining its own, so the core has to be there first.
      The other three are self-contained and could go in any order.
    -->
    <script
      src="https://cdn.jsdelivr.net/npm/@toclocoinc/lattice-grid@1.62.0/lattice-grid.min.js"
      integrity="sha384-b5nernz4vX8906mEdRj5eqy+mQ1+8neeBHCoJKD2TNruRYOgJEXlkK6sT00vVjsQ"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@toclocoinc/lattice-grid@1.62.0/modules/charts.min.js"
      integrity="sha384-qV4yljo/7rwY/JdKHj96YQ7zuc+6Fs2SujqIKg10If+bD8y5ChGDT1baj2h5o0wx"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@toclocoinc/lattice-grid@1.62.0/modules/data-router.min.js"
      integrity="sha384-2eYaTqBYJXzYEZ19Cgcpg4RkOZMISNRhb7jc3vC8nC/9jKu9dyDojRK5FLgIaYXp"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@toclocoinc/lattice-grid@1.62.0/modules/kpi.min.js"
      integrity="sha384-xkhL0KtS/uoUBx7eQba1BN2OQvdXdA0+jMsp21V1Jd2YykqDTGmxwiN6tVNbKaBe"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@toclocoinc/lattice-grid@1.62.0/modules/tabs.min.js"
      integrity="sha384-2Izv6jvwxtHZZdPNzlyjPiEfFClcDHeRtkQafEWKWp2Ly8kTaugWefTNwhl4xQm0"
      crossorigin="anonymous"
    ></script>

    <!-- The demo's own code, in the order each file needs the one before it. -->
    <script src="./src/licence.js"></script>
    <script src="./src/hmrc-api.js"></script>
    <script src="./src/dashboard.js"></script>
    <script src="./main.js"></script>
  </body>
</html>
